# Default demo input is a live camera. Use 0 for /dev/video0, camera:1 for
# another camera, or set YOLO_SOURCE/VIDEO_PATH when running the shell script.
source: 0
weights: yolo/weights/best.pt
output_dir: pgm_output

confidence: 0.65
iou: 0.45
imgsz: 640
device: ""
selection: center_conf
display: true
window_title: YOLO Live
camera_width: 0
camera_height: 0
camera_fps: 0
max_frames: 0

# Wait until a detected digit is fully visible and near the center before
# starting the segment save timer. This avoids saving half-visible digits as
# they enter from the left/right edge of the camera frame.
require_fully_visible: true
min_edge_margin: 0.06
require_centered: true
center_x_min: 0.30
center_x_max: 0.70
center_y_min: 0.15
center_y_max: 0.85

target_size: 28
digit_box_size: 20
bbox_padding: 0.30

min_stable_frames: 3
missing_frames_to_close_segment: 5
min_frames_between_saves: 12

allow_same_label_motion_split: false
same_label_center_distance: 0.45
label_change_center_distance: 0.18

save_debug_crops: true
